name: rc2-development-tests
on:
  push:
    branches: [release/v0.1.0-rc2]
  workflow_dispatch:
jobs:
  runtime-adversarial:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.14'}
      - run: python -m pip install 'cryptography==50.0.2'
      - name: RC1 core regression
        run: python -m unittest discover -s tests/source -p 'test_dev*.py' -v
      - name: RC2 adversarial exploration
        run: python -m unittest discover -s tests/rc2 -p 'test_*.py' -v
      - name: Hard release safety invariants
        run: |
          python - <<'PY'
          import json
          m=json.load(open('release/manifest-v0.1.0-rc2.json'))
          assert m['mainnet'] is False
          assert m['production_apply'] is False
          assert m['features']['permanent_apply'] is False
          s=open('src/hashburst_node/exploration.py',encoding='utf-8').read().replace(' ','')
          assert "'production_apply':True" not in s
          assert 'hb-mining-apply-intent-v1' not in s
          print('RC2 hard safety invariants PASS')
          PY
