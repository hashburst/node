name: rc2-conformance
on:
  push:
    branches: [release/v0.1.0-rc2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.14'}
      - name: RC1 and RC2 static gates
        run: |
          python tools/rc1_gate.py
          python tools/rc2_gate.py
      - name: RC1 Enrollment exact provenance dependency and 67 tests
        run: |
          test "$(sha256sum vendor/enrollment/HashBurst-Enrollment-0.2.0-dev3.zip | awk '{print $1}')" = "9c6ba3434f5a14dee2bb7bdd8e1b6e87f44418a47e03a0437feda147521ccd73"
          mkdir /tmp/enrollment && unzip -q vendor/enrollment/HashBurst-Enrollment-0.2.0-dev3.zip -d /tmp/enrollment
          cd /tmp/enrollment
          sha256sum -c SHA256SUMS
          python -m pip install -r requirements.txt
          test "$(python -c 'import cryptography; print(cryptography.__version__)')" = "50.0.2"
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: RC1 Node dev1-dev4 regression
        run: python -m unittest discover -s tests/source -p 'test_dev*.py' -v
      - name: RC1 Stage B historical regression in isolated tree
        run: |
          rm -rf /tmp/stageb-src /tmp/stageb-tests
          cp -a src /tmp/stageb-src
          cp -a tests/source /tmp/stageb-tests
          cp experimental/stageb/hashburst_node/exploration.py /tmp/stageb-src/hashburst_node/exploration.py
          cp experimental/stageb/hashburst_node/exploration_journal.py /tmp/stageb-src/hashburst_node/exploration_journal.py
          cp experimental/stageb/tests/test_stageb.py /tmp/stageb-tests/test_stageb.py
          PYTHONPATH=/tmp/stageb-src python -m unittest discover -s /tmp/stageb-tests -p 'test_*.py' -v
      - name: RC1 Accelerator 0.1.3 exact provenance and tests
        run: |
          git clone -q https://github.com/hashburst/mining-accelerator.git /tmp/mining-accelerator
          cd /tmp/mining-accelerator
          git checkout -q fdfab9d0a74e5e3324cc9f8411fcb64dab0dfcf1
          test "$(sha256sum accelerator.py | awk '{print $1}')" = "5bcff576a5ebb0b63d6d21eacfe07fba0d19a6040d2ebacc234fa59ff933549b"
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: RC2 adversarial exploration runtime
        run: python -m unittest discover -s tests/rc2 -p 'test_*.py' -v
      - name: Release metadata syntax and hard safety
        run: |
          python -m json.tool release/manifest-v0.1.0-rc1.json >/dev/null
          python -m json.tool release/manifest-v0.1.0-rc2.json >/dev/null
          python -m json.tool release/sbom-v0.1.0-rc1.cdx.json >/dev/null
          python -m json.tool release/sbom-v0.1.0-rc2.cdx.json >/dev/null
          grep -q '"hashburst.production_apply", "value": "false"' release/sbom-v0.1.0-rc2.cdx.json || grep -q '"name": "hashburst.production_apply"' release/sbom-v0.1.0-rc2.cdx.json
          python tools/rc2_gate.py
      - name: RC2 install upgrade rollback persistent-state sandbox
        run: |
          ROOT=/tmp/hashburst-rc2
          STATE=/tmp/hashburst-state
          PREV="$ROOT/releases/v0.1.0-rc1"
          mkdir -p "$PREV" "$STATE/control" "$STATE/exploration/explore-completed"
          printf 'identity-sentinel' > "$STATE/identity.sentinel"
          printf 'anti-replay-sentinel' > "$STATE/control/anti-replay.sqlite"
          printf 'prestate-sentinel' > "$STATE/exploration/explore-completed/pre-state.json"
          printf 'events-sentinel' > "$STATE/exploration/explore-completed/events.jsonl"
          printf 'receipt-sentinel' > "$STATE/exploration/explore-completed/receipt.signed.json"
          ln -s "$PREV" "$ROOT/current"
          sudo env HB_NODE_STATE="$STATE" sh packaging/install-rc2.sh "$ROOT"
          test "$(cat "$STATE/identity.sentinel")" = identity-sentinel
          test "$(cat "$STATE/control/anti-replay.sqlite")" = anti-replay-sentinel
          test "$(cat "$STATE/exploration/explore-completed/pre-state.json")" = prestate-sentinel
          test "$(cat "$STATE/exploration/explore-completed/events.jsonl")" = events-sentinel
          test "$(cat "$STATE/exploration/explore-completed/receipt.signed.json")" = receipt-sentinel
          sudo env HB_NODE_STATE="$STATE" sh packaging/rollback-rc2.sh "$ROOT"
          test "$(readlink "$ROOT/current")" = "$PREV"
          test "$(cat "$STATE/identity.sentinel")" = identity-sentinel
          test "$(cat "$STATE/control/anti-replay.sqlite")" = anti-replay-sentinel
          test "$(cat "$STATE/exploration/explore-completed/events.jsonl")" = events-sentinel
      - name: Interrupted exploration blocks executable rollback
        run: |
          ROOT=/tmp/hashburst-rc2-block
          STATE=/tmp/hashburst-state-block
          PREV="$ROOT/releases/v0.1.0-rc1"
          CUR="$ROOT/releases/v0.1.0-rc2"
          mkdir -p "$PREV" "$CUR" "$STATE/control" "$STATE/exploration/explore-interrupted"
          printf 'anti-replay-sentinel' > "$STATE/control/anti-replay.sqlite"
          printf 'prestate-sentinel' > "$STATE/exploration/explore-interrupted/pre-state.json"
          printf 'events-sentinel' > "$STATE/exploration/explore-interrupted/events.jsonl"
          ln -s "$CUR" "$ROOT/current"
          printf '%s\n' "$PREV" > "$ROOT/previous-release"
          if sudo env HB_NODE_STATE="$STATE" sh packaging/rollback-rc2.sh "$ROOT"; then
            echo 'rollback unexpectedly succeeded with interrupted exploration' >&2; exit 1
          fi
          test "$(readlink "$ROOT/current")" = "$CUR"
          test "$(cat "$STATE/control/anti-replay.sqlite")" = anti-replay-sentinel
          test "$(cat "$STATE/exploration/explore-interrupted/pre-state.json")" = prestate-sentinel
          test "$(cat "$STATE/exploration/explore-interrupted/events.jsonl")" = events-sentinel
