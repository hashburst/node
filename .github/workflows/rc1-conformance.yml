name: rc1-conformance
on:
  push:
    branches: [release/v0.1.0-rc1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node dev1-dev4
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests/source -p 'test_dev*.py' -v
      - name: Stage B regression
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          cp experimental/stageb/hashburst_node/exploration.py src/hashburst_node/exploration.py
          cp experimental/stageb/hashburst_node/exploration_journal.py src/hashburst_node/exploration_journal.py
          cp experimental/stageb/tests/test_stageb.py tests/source/test_stageb.py
          python -m unittest discover -s tests/source -p 'test_*.py' -v
      - name: Accelerator 0.1.3 exact commit
        run: |
          git clone https://github.com/hashburst/mining-accelerator.git /tmp/mining-accelerator
          cd /tmp/mining-accelerator
          git checkout fdfab9d0a74e5e3324cc9f8411fcb64dab0dfcf1
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -p 'test_*.py' -v
          test "$(sha256sum accelerator.py | awk '{print $1}')" = "5bcff576a5ebb0b63d6d21eacfe07fba0d19a6040d2ebacc234fa59ff933549b"
      - name: Enrollment exact-source gate
        run: python tools/rc1_gate.py
